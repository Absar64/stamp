<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 70" role="img" aria-label="Accepted payment methods: Visa, Mastercard, PayPal, American Express" font-family="Outfit, Arial, Helvetica, sans-serif">
  <!-- Visa -->
  <g>
    <rect x="10" y="3" width="100" height="64" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="60" y="44" text-anchor="middle" font-size="26" font-weight="800" font-style="italic" fill="#1a1f71">VISA</text>
  </g>
  <!-- Mastercard -->
  <g>
    <rect x="130" y="3" width="100" height="64" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="170" cy="35" r="17" fill="#eb001b"/>
    <circle cx="192" cy="35" r="17" fill="#f79e1b" fill-opacity="0.9"/>
  </g>
  <!-- PayPal -->
  <g>
    <rect x="250" y="3" width="100" height="64" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="300" y="43" text-anchor="middle" font-size="22" font-weight="800" font-style="italic">
      <tspan fill="#003087">Pay</tspan><tspan fill="#009cde">Pal</tspan>
    </text>
  </g>
  <!-- American Express -->
  <g>
    <rect x="370" y="3" width="100" height="64" rx="9" fill="#2e77bc"/>
    <text x="420" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">AMEX</text>
  </g>
</svg>
